<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#162e33">
  <meta name="description" content="NEXUS: um canto organizado para seus clientes, serviços e projetos.">
  <title>NEXUS — Seu espaço de trabalho</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script defer src="/app.js"></script>
</head>
<body>
  <svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10H3V10Z"/><path d="M9 20v-7h6v7"/></symbol>
    <symbol id="i-briefcase" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18"/></symbol>
    <symbol id="i-people" viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21v-2a7 7 0 0 1 14 0v2M17 5a4 4 0 0 1 0 7.5M18 16a6 6 0 0 1 4 5"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 2 9 5-9 5-9-5 9-5Zm-9 10 9 5 9-5M3 17l9 5 9-5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M5 5 19 19M19 5 5 19"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="m4 17 13-13 3 3-13 13-4 1 1-4ZM14 7l3 3"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 4h4M7 7l1 14h8l1-14M10 11v6M14 11v6"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m4 12 6 6L20 6"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></symbol>
    <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 2v10M6 5a9 9 0 1 0 12 0"/></symbol>
  </svg>

  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true"><i></i><i></i><i></i></span>
        <div class="brand-text"><strong>NEXUS<span>.</span></strong><small>workroom / edição local</small></div>
      </div>
      <div class="nav-caption">ESPAÇO DE TRABALHO</div>
      <nav class="nav" aria-label="Seções">
        <button type="button" data-page="inicio" class="nav-link active"><svg><use href="#i-home"/></svg><span>Início</span><b>01</b></button>
        <button type="button" data-page="pedidos" class="nav-link"><svg><use href="#i-briefcase"/></svg><span>Projetos</span><b id="nav-total">0</b></button>
        <button type="button" data-page="clientes" class="nav-link"><svg><use href="#i-people"/></svg><span>Clientes</span></button>
        <button type="button" data-page="servicos" class="nav-link"><svg><use href="#i-layers"/></svg><span>Serviços</span></button>
      </nav>
      <div class="sidebar-foot">
        <div class="sidebar-note"><span>✳</span><p>O trabalho é seu.<br><em>A organização, a gente simplifica.</em></p></div>
        <div class="local-status"><span class="pulse"></span> SEUS DADOS FICAM AQUI</div>
        <button class="exit-link" type="button" id="close-app"><svg><use href="#i-power"/></svg>Encerrar NEXUS</button>
      </div>
    </aside>
    <div class="shade" id="shade" hidden></div>

    <div class="workspace">
      <header class="topbar">
        <div class="topbar-left"><button class="mobile-menu" id="mobile-menu" aria-label="Abrir navegação"><svg><use href="#i-menu"/></svg></button>
          <span>NEXUS</span><em>/</em><strong id="breadcrumb">INÍCIO</strong>
        </div>
        <div class="topbar-right"><span id="today"></span><span class="top-avatar" aria-hidden="true">N<span>✳</span></span></div>
      </header>
      <main id="main-content"></main>
      <footer class="footer"><span>NEXUS Workroom — uma coisa de cada vez.</span><span>Feito para o mundo real. <b>✳</b></span></footer>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
